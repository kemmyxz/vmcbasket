<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom QR Scanner</title>
    <script src="../../node_modules/html5-qrcode/html5-qrcode.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          136deg,
          rgba(255, 166, 171, 0.7) 17.46%,
          rgba(86, 121, 255, 0.7) 93.71%
        );
        font-family: "Poppins", sans-serif;
      }
      .scanner-wrapper {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      }
      .logo {
        width: 160px;
        margin-bottom: 20px;
      }
      #reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 15px;
      }
      .btn-main {
        background: #26387d;
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        font-size: 16px;
        width: 100%;
        margin-bottom: 10px;
      }
      .btn-stop {
        background: #d9534f;
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        font-size: 16px;
        width: 100%;
      }
      .instruction {
        font-size: 14px;
        margin-top: 10px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="scanner-wrapper">
      <img src="../images/vmc_basket_logo.png" alt="Logo" class="logo" />
      <h5 class="fw-bold">Scan your QR Code</h5>
      <img src="../images/qr-code-icon.png" id="qrIcon" />

      <div id="reader"></div>

      <button id="startScanBtn" class="btn-main">Start Scanning</button>
      <button id="stopScanBtn" class="btn-stop d-none">Stop Scanning</button>

      <p class="instruction">Place QR code inside the frame to scan.</p>
      <div id="result" class="mt-3"></div>
    </div>

    <script>
      let lastScannedCode = null;
      let lastScanTime = 0;
      const SCAN_COOLDOWN = 1000;
      let html5QrCode;
      let isProcessing = false;
      let isScanning = false;

      // Update the processQRCode function:
      async function processQRCode(decodedText) {
          if (isProcessing) return;
          isProcessing = true;
      
          try {
              const qrData = JSON.parse(decodedText);
              console.log('Processing QR data:', qrData);
      
              if (!qrData.receipt_id || !Array.isArray(qrData.items)) {
                  throw new Error("Invalid QR code format - missing receipt_id or items array");
              }
      
              if (qrData.items.length === 0) {
                  throw new Error("QR code contains no items to process");
              }
      
              // Process each item in the receipt
              const results = [];
              for (const item of qrData.items) {
                  // Validate item structure
                  if (!item.variant_id) {
                      console.error('Invalid item:', item);
                      throw new Error(`Missing variant_id in item data`);
                  }
      
                  if (!item.quantity || item.quantity < 1) {
                      console.error('Invalid quantity:', item);
                      throw new Error(`Invalid quantity for variant ${item.variant_id}`);
                  }
      
                  try {
                      console.log(`Processing variant ID: ${item.variant_id}, Quantity: ${item.quantity}`);
                      
                      const response = await fetch("process_reduction.php", {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({
                              variant_id: parseInt(item.variant_id),
                              quantity: parseInt(item.quantity),
                              receipt_id: qrData.receipt_id
                          })
                      });
      
                      const data = await response.json();
                      console.log('Server response:', data);
      
                      if (!data.success) {
                          throw new Error(data.message || 'Unknown error occurred');
                      }
                      
                      results.push(data);
                  } catch (itemError) {
                      console.error('Item processing error:', itemError);
                      throw new Error(`Failed to process variant ID ${item.variant_id}: ${itemError.message}`);
                  }
              }
      
              if (results.length > 0) {
                  showMultipleSuccess(results);
              } else {
                  throw new Error("No items were successfully processed");
              }
          } catch (error) {
              console.error('QR processing error:', error);
              showError(`Error: ${error.message}`);
          } finally {
              isProcessing = false;
          }
      }     
           
      
      function showError(message) {
          const errorDiv = document.getElementById("result");
          errorDiv.innerHTML = `
              <div class="alert alert-danger">
                  <h5 class="alert-heading">
                      <i class="bi bi-exclamation-triangle"></i> Error Occurred
                  </h5>
                  <hr>
                  <p class="mb-2"><strong>Error Details:</strong></p>
                  <p class="text-danger">${message}</p>
                  <div class="mt-3">
                      <p class="mb-1"><strong>Troubleshooting Steps:</strong></p>
                      <ul class="mb-2">
                          <li>Verify that the QR code is from a valid receipt</li>
                          <li>Check if the product variants exist in the system</li>
                          <li>Try rescanning the QR code</li>
                      </ul>
                      <small class="text-muted d-block">If the problem persists, please note down the error message and contact the system administrator.</small>
                  </div>
              </div>
              <button class="btn btn-primary mt-2" onclick="startScanner()">
                  Try Again
              </button>
          `;
      
          // Stop the scanner when showing an error
          stopScanner();
      
          // Log the error for debugging
          console.error('Scanner Error:', message);
      }   
      
      function showSuccess(data) {
        lastScannedCode = data.variant_id;
        lastScanTime = Date.now();

        const timestamp = new Date().toLocaleString();
        document.getElementById("result").innerHTML = `
    <div class="alert alert-success">
        <h5 class="alert-heading"><i class="bi bi-check-circle"></i> Stock Updated Successfully!</h5>
        <hr>
        <p><strong>Product:</strong> ${data.product_name}</p>
        <p><strong>Stock Deducted:</strong> -${data.quantity} units</p>
        <p><strong>New Stock Level:</strong> ${data.new_stock} units</p>
        <small class="text-muted">Transaction completed at ${timestamp}</small>
    </div>
    <button class="btn btn-primary mt-2" id="scanAgainBtn" disabled>
        Scan Another Code
    </button>
    `;

        stopScanner(); // ✅ stop preview after success

        const scanAgainBtn = document.getElementById("scanAgainBtn");
        let countdown = 1;

        const timer = setInterval(() => {
          countdown--;
          scanAgainBtn.textContent = `Scan Another Code (${countdown}s)`;

          if (countdown <= 0) {
            clearInterval(timer);
            scanAgainBtn.textContent = "Scan Another Code";
            scanAgainBtn.disabled = false;
            isProcessing = false;
          }
        }, 1000);

        // Restart scanner when clicked
        scanAgainBtn.onclick = () => {
          document.getElementById("result").innerHTML = "";
          startScanner();
        };

        // Play success sound
        const audio = new Audio("../../assets/success.mp3");
        audio.play().catch((e) => console.log("Audio play failed:", e));
      }

      // Add new function to show multiple items success
      function showMultipleSuccess(results) {
        const timestamp = new Date().toLocaleString();
        let itemsHtml = results
          .map(
            (data) => `
        <div class="mb-2">
            <p><strong>Product:</strong> ${data.product_name}</p>
            <p><strong>Stock Deducted:</strong> -${data.quantity} units</p>
            <p><strong>New Stock Level:</strong> ${data.new_stock} units</p>
        </div>`
          )
          .join("<hr>");

        document.getElementById("result").innerHTML = `
        <div class="alert alert-success">
            <h5 class="alert-heading"><i class="bi bi-check-circle"></i> Stock Updated Successfully!</h5>
            <hr>
            ${itemsHtml}
            <small class="text-muted">Transaction completed at ${timestamp}</small>
        </div>
        <button class="btn btn-primary mt-2" id="scanAgainBtn" disabled>
            Scan Another Code
        </button>
    `;

        stopScanner();
        const scanAgainBtn = document.getElementById("scanAgainBtn");
        let countdown = 1;

        const timer = setInterval(() => {
          countdown--;
          scanAgainBtn.textContent = `Scan Another Code (${countdown}s)`;

          if (countdown <= 0) {
            clearInterval(timer);
            scanAgainBtn.textContent = "Scan Another Code";
            scanAgainBtn.disabled = false;
            isProcessing = false;
          }
        }, 1000);

        scanAgainBtn.onclick = () => {
          document.getElementById("result").innerHTML = "";
          startScanner();
        };

        const audio = new Audio("../../assets/success.mp3");
        audio.play().catch((e) => console.log("Audio play failed:", e));
      }

      // Replace the existing onScanSuccess function with:
      function onScanSuccess(decodedText, decodedResult) {
          try {
              console.log('Raw QR code content:', decodedText);
              
              // Check if the content is a number (legacy format)
              if (/^\d+$/.test(decodedText)) {
                  // Handle legacy numeric QR code
                  processLegacyQRCode(decodedText);
                  return;
              }
              
              // Handle JSON format QR code
              if (!decodedText.startsWith('{') || !decodedText.endsWith('}')) {
                  throw new Error("Invalid QR code format: Content must be JSON data");
              }
              
              const cleanedText = decodedText.trim();
              const qrData = JSON.parse(cleanedText);
              
              if (!qrData.receipt_id || !Array.isArray(qrData.items)) {
                  throw new Error("QR code missing required fields");
              }
              
              processQRCode(cleanedText);
          } catch (error) {
              showError(`Error: ${error.message}`);
          }
      }

      // Add new function to handle legacy numeric QR codes
      async function processLegacyQRCode(variantId) {
          if (isProcessing) return;
          isProcessing = true;

          try {
              const response = await fetch("process_reduction.php", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                      variant_id: parseInt(variantId),
                      quantity: 1  // Default quantity for legacy codes
                  })
              });

              const data = await response.json();
              console.log('Server response:', data);

              if (!data.success) {
                  throw new Error(data.message);
              }

              showSuccess(data);
          } catch (error) {
              showError(`Error processing item: ${error.message}`);
          } finally {
              isProcessing = false;
          }
      }

      // Start scanner (hide QR icon, show/hide buttons)
      async function startScanner() {
        if (isScanning) return;
        document.getElementById("qrIcon").style.display = "none";
        html5QrCode = new Html5Qrcode("reader");
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 550, height: 550 } },
            onScanSuccess
          );
          isScanning = true;
          document.getElementById("startScanBtn").classList.add("d-none");
          document.getElementById("stopScanBtn").classList.remove("d-none");
        } catch (err) {
          showError("Camera start failed: " + err);
        }
      }

      // Stop scanner (show QR icon, show/hide buttons)
      async function stopScanner() {
        if (!isScanning) return;
        await html5QrCode.stop();
        await html5QrCode.clear();
        isScanning = false;
        document.getElementById("qrIcon").style.display = "";
        document.getElementById("startScanBtn").classList.remove("d-none");
        document.getElementById("stopScanBtn").classList.add("d-none");
      }

      // Bind buttons
      document
        .getElementById("startScanBtn")
        .addEventListener("click", startScanner);
      document
        .getElementById("stopScanBtn")
        .addEventListener("click", stopScanner);
    </script>
  </body>
</html>
