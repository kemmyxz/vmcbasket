<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Reduction Scanner</title>
    <script src="../../node_modules/html5-qrcode/html5-qrcode.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4" >
        <div id="scanner-container" >
            <div id="reader"></div>
            <div id="result" class="mt-3"></div>
        </div>
    </div>

    <script>
        let lastScannedCode = null;
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 1000; 
        let html5QrcodeScanner;
        let isProcessing = false;

        function showError(message) {
            document.getElementById('result').innerHTML = `
                <div class="alert alert-danger">
                    Error: ${message}
                </div>`;
        }

        function showSuccess(data) {
            // Store the last scanned code and time
            lastScannedCode = data.variant_id;
            lastScanTime = Date.now();
            
            const timestamp = new Date().toLocaleString();
            document.getElementById('result').innerHTML = `
                <div class="alert alert-success">
                    <h5 class="alert-heading"><i class="bi bi-check-circle"></i> Stock Updated Successfully!</h5>
                    <hr>
                    <p><strong>Product:</strong> ${data.product_name}</p>
                    <p><strong>Stock Deducted:</strong> -1 unit</p>
                    <p><strong>New Stock Level:</strong> ${data.new_stock} units</p>
                    <small class="text-muted">Transaction completed at ${timestamp}</small>
                </div>
                <button class="btn btn-primary mt-2" id="scanAgainBtn" disabled>
                    Scan Another Code
                </button>
            `;

            // Stop the scanner correctly
            html5QrcodeScanner.clear();

            // Enable the scan button after cooldown
            const scanAgainBtn = document.getElementById('scanAgainBtn');
            let countdown = 1;
            
            const timer = setInterval(() => {
                countdown--;
                scanAgainBtn.textContent = `Scan Another Code (${countdown}s)`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    scanAgainBtn.textContent = 'Scan Another Code';
                    scanAgainBtn.disabled = false;
                    isProcessing = false;
                }
            }, 1000);

            // Add click event to restart scanner
            scanAgainBtn.onclick = () => {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10,
                        qrbox: { width: 550, height: 550 }
                    }
                );
                html5QrcodeScanner.render(onScanSuccess);
                document.getElementById('result').innerHTML = '';
            };

            // Play success sound
            const audio = new Audio('../../assets/success.mp3');
            audio.play().catch(e => console.log('Audio play failed:', e));
        }

        async function processQRCode(decodedText) {
            if (isProcessing) {
                return;
            }

            isProcessing = true;

            try {
                const response = await fetch('process_reduction.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        variant_id: decodedText
                    })
                });

                // Check if response is valid JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Server response was not JSON');
                }

                const data = await response.json();
                
                if (data.success) {
                    showSuccess(data);
                } else {
                    showError(data.message || 'Unknown error occurred');
                    isProcessing = false;
                }
            } catch (error) {
                showError(error.message || 'Failed to process QR code');
                isProcessing = false;
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Validate QR code format
            if (!decodedText || isNaN(decodedText)) {
                showError('Invalid QR code format');
                return;
            }
            
            processQRCode(decodedText);
        }

        // Initialize scanner
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10,
                qrbox: { width: 550, height: 550 }
            }
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
