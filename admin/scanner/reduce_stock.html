<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom QR Scanner</title>
    <script src="../../node_modules/html5-qrcode/html5-qrcode.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          136deg,
          rgba(255, 166, 171, 0.7) 17.46%,
          rgba(86, 121, 255, 0.7) 93.71%
        );
        font-family: "Poppins", sans-serif;
      }
      .scanner-wrapper {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      }
      .logo {
        width: 160px;
        margin-bottom: 20px;
      }
      #reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 15px;
      }
      .btn-main {
        background: #26387d;
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        font-size: 16px;
        width: 100%;
        margin-bottom: 10px;
      }
      .btn-stop {
        background: #d9534f;
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        font-size: 16px;
        width: 100%;
      }
      .instruction {
        font-size: 14px;
        margin-top: 10px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="scanner-wrapper">
      <img src="../images/vmc_basket_logo.png" alt="Logo" class="logo" />
      <h5 class="fw-bold">Scan your QR Code</h5>
      <img src="../images/qr-code-icon.png" id="qrIcon" />

      <div id="reader"></div>

      <button id="startScanBtn" class="btn-main">Start Scanning</button>
      <button id="stopScanBtn" class="btn-stop d-none">Stop Scanning</button>

      <p class="instruction">Place QR code inside the frame to scan.</p>
      <div id="result" class="mt-3"></div>
    </div>

    <script>
      let lastScannedCode = null;
      let lastScanTime = 0;
      const SCAN_COOLDOWN = 1000;
      let html5QrCode;
      let isProcessing = false;
      let isScanning = false;

      function showError(message) {
        document.getElementById("result").innerHTML = `
      <div class="alert alert-danger">
          Error: ${message}
      </div>`;
      }

      function showSuccess(data) {
        lastScannedCode = data.variant_id;
        lastScanTime = Date.now();

        const timestamp = new Date().toLocaleString();
        document.getElementById("result").innerHTML = `
      <div class="alert alert-success">
          <h5 class="alert-heading"><i class="bi bi-check-circle"></i> Stock Updated Successfully!</h5>
          <hr>
          <p><strong>Product:</strong> ${data.product_name}</p>
          <p><strong>Stock Deducted:</strong> -1 unit</p>
          <p><strong>New Stock Level:</strong> ${data.new_stock} units</p>
          <small class="text-muted">Transaction completed at ${timestamp}</small>
      </div>
      <button class="btn btn-primary mt-2" id="scanAgainBtn" disabled>
          Scan Another Code
      </button>
    `;

        stopScanner(); // ✅ stop preview after success

        const scanAgainBtn = document.getElementById("scanAgainBtn");
        let countdown = 1;

        const timer = setInterval(() => {
          countdown--;
          scanAgainBtn.textContent = `Scan Another Code (${countdown}s)`;

          if (countdown <= 0) {
            clearInterval(timer);
            scanAgainBtn.textContent = "Scan Another Code";
            scanAgainBtn.disabled = false;
            isProcessing = false;
          }
        }, 1000);

        // Restart scanner when clicked
        scanAgainBtn.onclick = () => {
          document.getElementById("result").innerHTML = "";
          startScanner();
        };

        // Play success sound
        const audio = new Audio("../../assets/success.mp3");
        audio.play().catch((e) => console.log("Audio play failed:", e));
      }

      async function processQRCode(decodedText) {
        if (isProcessing) return;

        isProcessing = true;

        try {
          const response = await fetch("process_reduction.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ variant_id: decodedText }),
          });

          const contentType = response.headers.get("content-type");
          if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Server response was not JSON");
          }

          const data = await response.json();

          if (data.success) {
            showSuccess(data);
          } else {
            showError(data.message || "Unknown error occurred");
            isProcessing = false;
          }
        } catch (error) {
          showError(error.message || "Failed to process QR code");
          isProcessing = false;
        }
      }

      function onScanSuccess(decodedText, decodedResult) {
        if (!decodedText || isNaN(decodedText)) {
          showError("Invalid QR code format");
          return;
        }
        processQRCode(decodedText);
      }

      // Start scanner (hide QR icon, show/hide buttons)
      async function startScanner() {
        if (isScanning) return;
        document.getElementById("qrIcon").style.display = "none";
        html5QrCode = new Html5Qrcode("reader");
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 550, height: 550 } },
            onScanSuccess
          );
          isScanning = true;
          document.getElementById("startScanBtn").classList.add("d-none");
          document.getElementById("stopScanBtn").classList.remove("d-none");
        } catch (err) {
          showError("Camera start failed: " + err);
        }
      }

      // Stop scanner (show QR icon, show/hide buttons)
      async function stopScanner() {
        if (!isScanning) return;
        await html5QrCode.stop();
        await html5QrCode.clear();
        isScanning = false;
        document.getElementById("qrIcon").style.display = "";
        document.getElementById("startScanBtn").classList.remove("d-none");
        document.getElementById("stopScanBtn").classList.add("d-none");
      }

      // Bind buttons
      document
        .getElementById("startScanBtn")
        .addEventListener("click", startScanner);
      document
        .getElementById("stopScanBtn")
        .addEventListener("click", stopScanner);
    </script>
  </body>
</html>
